[package]
authors = { workspace = true }
description = "fedimint-usdt-client is the client-side module for USDT-on-EVM peg-in/peg-out."
edition = { workspace = true }
license = { workspace = true }
name = "fedimint-usdt-client"
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
rustc-args = ["--cfg", "tokio_unstable"]

[features]
cli = ["dep:clap"]
default = []
# Exposes adversarial/test-only raw-input submission
# (`UsdtClientModule::submit_crafted_input_for_test`) used by
# `fedimint-usdt-tests`' security harness. Deliberately NOT part of `default`,
# so it is never compiled into the guardian/gateway release image.
test-util = []

[lib]
name = "fedimint_usdt_client"
path = "src/lib.rs"

[dependencies]
# Pure, WASM-safe alloy leaf crates for the deposit-by-proof submit flow:
# reconstruct the block `Header` from an `eth_getBlockByNumber` JSON response
# and RLP-encode it (asserting `keccak256 == blockHash` locally before
# submitting). Deliberately does NOT pull in `alloy-trie` (proof verification is
# server-side only) nor `alloy-provider`/reqwest+tokio (not WASM-safe) -- the
# JSON-RPC transport is the same `reqwest` path `fedimint-client-module` already
# ships to WASM.
alloy-consensus = { workspace = true, features = ["serde"] }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, optional = true }
erased-serde = { workspace = true }
fedimint-api-client = { workspace = true }
fedimint-client-module = { workspace = true }
fedimint-core = { workspace = true }
fedimint-derive-secret = { workspace = true }
fedimint-logging = { workspace = true }
fedimint-usdt-common = { workspace = true }
futures = { workspace = true }
# WASM-safe HTTP: on wasm32 `reqwest` compiles against the browser Fetch API
# (the same wasm-safe path `fedimint-client-module` uses for meta-override
# fetches), never tokio/native TLS. Used only for the deposit-by-proof
# JSON-RPC calls (`eth_getProof`/`eth_getBlockByNumber`).
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
