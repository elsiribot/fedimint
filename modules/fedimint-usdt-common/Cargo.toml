[package]
authors = { workspace = true }
description = "fedimint-usdt-common contains the common types for the USDT-on-EVM fedimint module"
edition = { workspace = true }
license = { workspace = true }
name = "fedimint-usdt-common"
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
rustc-args = ["--cfg", "tokio_unstable"]

[lib]
name = "fedimint_usdt_common"
path = "src/lib.rs"

[dependencies]
# `serde` is additive to the workspace default (`std`) feature set: it is
# needed here (unlike other `alloy-primitives` consumers in the workspace)
# because `user_op::UnsignedUserOp` derives `Serialize`/`Deserialize` over a
# struct containing `alloy_primitives::U256` fields. Pure serialization
# support, no wasm-incompatible surface.
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types = { workspace = true }
anyhow = { workspace = true }
fedimint-core = { workspace = true }
secp256k1 = { workspace = true }
serde = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
hex_lit = { workspace = true }

[lints]
workspace = true
