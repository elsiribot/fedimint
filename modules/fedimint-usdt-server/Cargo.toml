[package]
authors = { workspace = true }
description = "fedimint-usdt-server contains the server-side consensus logic for the USDT-on-EVM fedimint module"
edition = { workspace = true }
license = { workspace = true }
name = "fedimint-usdt-server"
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
rustc-args = ["--cfg", "tokio_unstable"]

[lib]
name = "fedimint_usdt_server"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
cggmp21 = { workspace = true, features = ["spof"] }
erased-serde = { workspace = true }
fedimint-core = { workspace = true }
fedimint-server-core = { workspace = true }
fedimint-threshold-ecdsa = { workspace = true }
fedimint-usdt-common = { workspace = true }
rand = { workspace = true }
secp256k1 = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bls12_381 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
