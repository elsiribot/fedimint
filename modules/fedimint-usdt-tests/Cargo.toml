[package]
authors = { workspace = true }
description = "fedimint-usdt-tests contains boot integration tests for the usdt module"
edition = { workspace = true }
license = { workspace = true }
name = "fedimint-usdt-tests"
publish = false
version = { workspace = true }

[lib]
name = "fedimint_usdt_tests"
path = "src/lib.rs"

[[bin]]
name = "usdt-e2e-test"
path = "bin/usdt_e2e.rs"

# Adversarial security tool: joins a LIVE federation via `--invite`, allocates a
# deposit address, and runs the no-funds deposit-by-proof attacks against it.
# Needs a live fed to run; not part of any CI lane. Reuses the shared attack
# constructors in `src/attacks.rs` (the same ones the `tests/adversary.rs`
# hermetic suite drives).
[[bin]]
name = "usdt-adversary"
path = "bin/usdt_adversary.rs"

# One-shot generator for the deterministic MPT deposit-proof verifier's
# committed fixtures (real mainnet `eth_getProof` captures). Not run in CI --
# see the file's module doc for how to re-capture/re-pin.
[[bin]]
name = "capture-deposit-proof-fixtures"
path = "bin/capture_deposit_proof_fixtures.rs"

[[test]]
name = "fedimint_usdt_tests"
path = "tests/tests.rs"

[dependencies]
alloy = { workspace = true }
# Leaf crates for the hermetic synthetic-proof builder (`tests/common/proof.rs`),
# mirroring `fedimint-usdt-server`'s deterministic MPT verifier deps. Test-only
# (this crate is never WASM-shipped).
alloy-consensus = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
alloy-trie = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
devimint = { workspace = true }
fedimint-api-client = { workspace = true }
# The adversary bin joins a live federation from an invite code (mirroring
# `fedimint-cli`'s client-join path).
fedimint-bip39 = { workspace = true }
fedimint-client = { workspace = true }
fedimint-client-module = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-core = { workspace = true }
fedimint-logging = { workspace = true }
fedimint-mint-client = { workspace = true }
fedimint-mint-common = { workspace = true }
fedimint-mint-server = { workspace = true }
fedimint-mintv2-client = { workspace = true }
fedimint-mintv2-common = { workspace = true }
fedimint-mintv2-server = { workspace = true }
fedimint-server = { workspace = true }
fedimint-testing = { workspace = true }
fedimint-usdt-client = { workspace = true, features = ["test-util"] }
fedimint-usdt-common = { workspace = true }
fedimint-usdt-server = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
